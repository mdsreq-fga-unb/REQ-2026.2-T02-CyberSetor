name: ci-api

# Integração contínua da linha da API: formatação, lint, tipos, testes unitários,
# migrações, testes de ponta a ponta, build e imagem de implantação em todo pull
# request para api-develop e api, e no push a essas branches. A versão do Node
# vem de api/.nvmrc e a do pnpm do campo packageManager de api/package.json
# (lido pelo pnpm/action-setup), para que o CI e a máquina de cada integrante
# usem o mesmo ambiente. Os testes de ponta a ponta correm contra um PostgreSQL
# real, com as migrações aplicadas pelo Prisma antes da suíte.

on:
  pull_request:
    branches: [api-develop, api]
  push:
    branches: [api-develop, api]

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cybersetor
          POSTGRES_PASSWORD: cybersetor
          POSTGRES_DB: cybersetor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cybersetor -d cybersetor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cybersetor:cybersetor@localhost:5432/cybersetor_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Há código?
        id: codigo
        run: |
          if [ -f package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sem código::api/package.json ainda não existe; a verificação fica para o esqueleto da API."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.codigo.outputs.existe == 'true'
        with:
          package_json_file: api/package.json

      - uses: actions/setup-node@v4
        if: steps.codigo.outputs.existe == 'true'
        with:
          node-version-file: api/.nvmrc
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Instalar dependências
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm install --frozen-lockfile

      - name: Formatação
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm fmt:check

      - name: Lint
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm lint

      - name: Tipos
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm typecheck

      - name: Testes unitários
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm test

      - name: Migração aplicada sem alteração
        if: steps.codigo.outputs.existe == 'true' && github.event_name == 'pull_request'
        run: |
          alteradas=$(git diff --name-only --diff-filter=MDR HEAD^1 HEAD -- prisma/migrations)
          if [ -n "$alteradas" ]; then
            echo "::error title=Migração alterada::migração já integrada não se edita nem se apaga; crie uma nova."
            echo "$alteradas"
            exit 1
          fi

      - name: Migrações no banco de teste
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm db:deploy

      - name: Schema sem mudança fora de migração
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm db:check

      - name: Testes de ponta a ponta
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm test:e2e

      - name: Build
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm build

  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cybersetor
          POSTGRES_PASSWORD: cybersetor
          POSTGRES_DB: cybersetor_imagem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cybersetor -d cybersetor_imagem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Imagem de implantação
        run: |
          if [ ! -f api/Dockerfile ]; then
            echo "::notice title=Sem Dockerfile::api/Dockerfile ainda não existe."
            exit 0
          fi
          docker build -t api-ci api
          # Em produção os anexos exigem S3. A API não acessa o bucket ao subir: valores fictícios bastam.
          docker run -d --name api-ci --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://cybersetor:cybersetor@localhost:5432/cybersetor_imagem \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e STORAGE_DRIVER=s3 \
            -e S3_ENDPOINT=http://127.0.0.1:9000 \
            -e S3_REGION=us-east-1 \
            -e S3_BUCKET=cybersetor-ci \
            -e S3_ACCESS_KEY_ID=ci \
            -e S3_SECRET_ACCESS_KEY=ci \
            api-ci
          for _ in $(seq 1 40); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' api-ci)
            [ "$estado" = healthy ] && exit 0
            [ "$(docker inspect --format '{{.State.Running}}' api-ci)" = false ] && break
            sleep 3
          done
          docker logs api-ci
          echo "::error title=Imagem::a API não ficou saudável (estado: $estado)."
          exit 1
