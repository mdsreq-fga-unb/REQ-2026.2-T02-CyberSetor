name: deploy-docs

# Publica o site no GitHub Pages. Executa na branch main, quando houver
# atualização nas issues e a cada seis horas: mudanças de Status e Sprint no
# quadro do projeto não geram evento no repositório, e as páginas de
# acompanhamento são lidas do quadro.

on:
  push:
    branches:
      - main
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  repository-projects: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identificar o que está sendo publicado
        run: |
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"

      - name: Configurar credenciais do git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Gerar ID de Cache Semanal
        id: cache-step
        run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ steps.cache-step.outputs.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: pip install -r requirements.txt

      - name: Sincronizar Tabela de Issues
        env:
          # PROJECTS_READ_TOKEN: token pessoal com escopo read:project. O token padrão
          # não lê projetos de organização; sem o segredo, as páginas saem sem situação.
          GITHUB_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/fetch_issues.py

      - name: Verificar antes de publicar
        run: mkdocs build --strict

      - name: Publicar no GitHub Pages
        run: mkdocs gh-deploy --force
