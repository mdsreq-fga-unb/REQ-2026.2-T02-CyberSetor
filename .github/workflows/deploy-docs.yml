name: deploy-docs

# Publica o site no GitHub Pages a partir da main. Gatilhos:
# - push na main que altere a documentação ou a sua geração (filtro de
#   caminhos abaixo); merge só de código não republica o site;
# - atualização nas issues e a cada seis horas: mudanças de Status e Sprint no
#   quadro do projeto não geram evento no repositório, e as páginas de
#   acompanhamento são lidas do quadro;
# - execução manual, com a versão a publicar (branch, tag ou commit; padrão main).
#   Quando a versão é uma tag de entrega (uN-AAAA-MM-DD), o commit publicado na
#   gh-pages recebe a tag uN-AAAA-MM-DD-pages: parte das páginas é gerada na hora
#   a partir do quadro, e a tag da main sozinha não reproduz o site entregue.
#
# Congelamento: com a variável de repositório DEPLOY_FREEZE igual a "true", só a
# execução manual publica; push na main, eventos de issue e a agenda são
# ignorados, e o job aviso-congelamento registra o motivo no log.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/scripts/**'
      - '.github/workflows/deploy-docs.yml'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  schedule:
    # Fora do minuto zero, horário de maior fila das execuções agendadas.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      versao:
        description: "Branch, tag ou commit a publicar (tag de entrega: uN-AAAA-MM-DD)"
        required: true
        default: main
        type: string

permissions:
  contents: write
  issues: read
  repository-projects: read

jobs:
  aviso-congelamento:
    if: vars.DEPLOY_FREEZE == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Registrar publicação suspensa
        run: echo "::warning title=Deploy congelado::DEPLOY_FREEZE=true. Evento ${{ github.event_name }} ignorado; o site publicado não foi alterado."

  deploy:
    if: vars.DEPLOY_FREEZE != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Concorrência no job, não no workflow: uma execução congelada (só aviso)
    # não pode ocupar a fila nem substituir uma publicação pendente.
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.versao || github.ref }}

      - name: Identificar o que está sendo publicado
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          echo "Versão:  ${VERSAO:-$GITHUB_REF_NAME}"
          echo "Commit:  $(git rev-parse HEAD)"

      - name: Configurar credenciais do git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Gerar ID de Cache Semanal
        id: cache-step
        run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ steps.cache-step.outputs.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: pip install -r requirements.txt

      - name: Sincronizar Tabela de Issues
        env:
          # PROJECTS_READ_TOKEN: token pessoal com escopo read:project. O token padrão
          # não lê projetos de organização; sem o segredo, as páginas saem sem situação.
          GITHUB_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/fetch_issues.py

      - name: Verificar antes de publicar
        run: mkdocs build --strict

      - name: Publicar no GitHub Pages
        run: mkdocs gh-deploy --force

      - name: Marcar o commit publicado da entrega
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          if [[ "$VERSAO" =~ ^u[0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            git fetch origin gh-pages
            git tag "${VERSAO}-pages" origin/gh-pages
            git push origin "${VERSAO}-pages"
          else
            echo "Versão $VERSAO não é tag de entrega; nenhuma marcação."
          fi
