name: build-check

# Verifica se o site compila sem avisos. Roda em pull request para qualquer
# branch e também em push nas branches de trabalho, para que um erro apareça
# antes da abertura do PR. A branch main não entra aqui: nela o deploy-docs
# executa a mesma verificação antes de publicar.
#
# As páginas de acompanhamento do nav (entregas/debitos-u1.md e
# gestao/sprints/tarefas-sprint-N.md) não estão versionadas: são geradas por .github/scripts/fetch_issues.py. Sem
# gerá-las, `mkdocs build --strict` aborta por referência de nav inexistente.
# Este workflow apenas compila; a publicação continua exclusiva do deploy-docs.

on:
  pull_request:
    branches:
      - main
      - docs-homologacao
  push:
    branches:
      - 'docs/**'
      - 'chore/**'
      - 'fix/**'
      - docs-homologacao

# Somente leitura: o gerador consulta as issues; nada é escrito no repositório.
permissions:
  contents: read
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identificar o contexto da verificação
        run: |
          echo "Evento:  ${{ github.event_name }}"
          echo "Branch:  ${{ github.head_ref || github.ref_name }}"
          echo "Destino: ${{ github.base_ref || 'não se aplica' }}"

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: pip install -r requirements.txt

      - name: Sincronizar Tabela de Issues
        env:
          # PROJECTS_READ_TOKEN: token pessoal com escopo read:project. O token padrão
          # não lê projetos de organização; sem o segredo, as páginas saem sem situação.
          GITHUB_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/fetch_issues.py

      - name: Conferir páginas geradas
        run: |
          faltou=0
          for pagina in docs/entregas/debitos-u1.md docs/gestao/sprints/tarefas-sprint-1.md docs/gestao/sprints/tarefas-sprint-2.md; do
            if [ ! -s "$pagina" ]; then
              echo "::error file=$pagina::Página gerada ausente ou vazia. O gerador de issues não produziu o arquivo (token ou permissão de leitura de issues?)."
              faltou=1
            fi
          done
          exit "$faltou"

      - name: Compilar o site em modo estrito
        run: mkdocs build --strict
