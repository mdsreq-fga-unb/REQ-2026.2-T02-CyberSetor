name: ci-web

# Integração contínua da linha do front: formatação, lint, tipos, testes e
# build em todo pull request para web-develop e web, e no push a essas
# branches. A versão do Node vem de web/.nvmrc e a do pnpm do campo
# packageManager de web/package.json (lido pelo pnpm/action-setup), para que o
# CI e a máquina de cada integrante usem o mesmo ambiente.

on:
  pull_request:
    branches: [web-develop, web]
  push:
    branches: [web-develop, web]

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Há código?
        id: codigo
        run: |
          if [ -f package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sem código::web/package.json ainda não existe; a verificação fica para o esqueleto do front."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.codigo.outputs.existe == 'true'
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        if: steps.codigo.outputs.existe == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Instalar dependências
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm install --frozen-lockfile

      - name: Formatação
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm fmt:check

      - name: Lint
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm lint

      - name: Tipos
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm typecheck

      - name: Testes
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm test

      - name: Build
        if: steps.codigo.outputs.existe == 'true'
        run: pnpm build
