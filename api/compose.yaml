services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: cybersetor
      POSTGRES_PASSWORD: dojo-local
      POSTGRES_DB: cybersetor_dojo
    ports:
      # Porta do host. Se 5432 já estiver ocupada na sua máquina, defina
      # DB_PORT no .env (e ajuste a porta em DATABASE_URL junto).
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersetor -d cybersetor_dojo"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pg_dojo:/var/lib/postgresql

volumes:
  pg_dojo:
