services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybersetor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersetor}
      POSTGRES_DB: ${POSTGRES_DB:-cybersetor}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cybersetor} -d ${POSTGRES_DB:-cybersetor}']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_dados:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dados:
